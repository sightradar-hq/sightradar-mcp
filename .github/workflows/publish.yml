name: Publish

# Publishes to npm when a tag like v0.1.1 is pushed.
#
# Auth: npm trusted publishing (OIDC). Set it up once on npmjs.com under the
# package's Settings > Trusted publisher: GitHub Actions, organization
# sightradar-hq, repository sightradar-mcp, workflow publish.yml. No secret is
# needed then. If an NPM_TOKEN repository secret exists it is used instead.
#
# A version that is already on npm (for example one published by hand) is
# skipped, so pushing its tag for the MCP Registry workflow does not fail here.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # No registry-url: setup-node would write an .npmrc that reads
      # NODE_AUTH_TOKEN, and an empty token breaks the OIDC exchange.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Tag matches package version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"

      - name: Skip if this version is already on npm
        id: check
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
            echo "$name@$version is already on npm; nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.skip != 'true'
        run: npm ci
      - if: steps.check.outputs.skip != 'true'
        run: npm run typecheck && npm test && npm run build

      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships npm 10.
      - if: steps.check.outputs.skip != 'true'
        run: npm install -g npm@^11.5.1

      - name: Publish
        if: steps.check.outputs.skip != 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
          fi
          npm publish --access public --provenance
